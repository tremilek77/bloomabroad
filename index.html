<!doctype html>
<html lang="en" class="saasta">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BloomAbroad checks application and immigration readiness for studying in Ireland, so students know where they stand before they apply."
    />
    <title>Enrolment Readiness for Studying in Ireland | BloomAbroad</title>

    <!--
      Structured data is injected per page by src/lib/schema.ts (Organization,
      WebSite, WebPage, FAQPage) and baked into each page by the prerender.
      Nothing is hard-coded here, so it can't drift from the page content.
    -->
    <script>
      // Set theme before first paint (avoids a flash): use the visitor's
      // saved choice if present, otherwise default to light.
      (function () {
        try {
          var t = localStorage.getItem('ba-theme')
          if (t !== 'light' && t !== 'dark') t = 'light'
          document.documentElement.dataset.theme = t
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
